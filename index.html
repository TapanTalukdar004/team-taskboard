<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team TaskBoard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>📋 Team TaskBoard</h1>
    <p class="muted">v1 — you can add tasks. Completing, deleting, counter and saving arrive via issues AB-1…AB-4.</p>

    <div class="row">
      <input id="taskInput" type="text" placeholder="What needs doing?" />
      <button id="addBtn">Add</button>
    </div>

    <!-- AB-3 will add a progress counter here -->
    <p id="counter" class="muted"></p>

    <ul id="list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
